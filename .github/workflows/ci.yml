name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # net48 and the Windows-only direct export need Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore RevitServerNet.sln
      - run: dotnet build RevitServerNet.sln -c Release --no-restore
      # The live Revit Server tests are skipped without the RSN_TEST_RS_* variables.
      - run: dotnet test RevitServerNet.sln -c Release --no-build
      - run: dotnet pack RevitServerNet.csproj -c Release --no-build -p:GeneratePackageOnBuild=false -o artifacts
      - name: Package smoke test
        shell: pwsh
        run: ./scripts/package-smoke.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
